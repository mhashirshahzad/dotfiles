include current-theme.conf
include os-specific.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Enable font ligatures
enable_ligatures always

# Cursor trail settings
# cursor_shape beam
cursor_trail         1 
cursor_trail_length  5

# audio bell using pulse audio
enable_audio_bell yes
command_on_bell paplay /usr/share/sounds/freedesktop/stereo/bell.oga

antialias            true
hinting              full


# default shell
shell fish
editor helix

# Bindigns
# map ctrl+q close_tab

# already set in hyprland :)
# map cmd+q close_tab 
# Font size
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
# Mouse
mouse_map ctrl+wheel_up change_font_size all +2.0
mouse_map ctrl+wheel_down change_font_size all -2.0

