"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\

$username\
$directory\

$git_branch\
$git_status\

$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\

$docker_context\

$time\

$line_break$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:text"
style_root = "fg:text"
format = '[ $user ]($style)'

[directory]
style = "fg:peach"
format = "[$path ]($style)"
truncation_length = 0
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[$symbol $branch ](fg:mauve)]($style)'

[git_status]
style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:mauve)]($style)'

[nodejs]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[c]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[cpp]
symbol = ""
disabled = false
format = '[$symbol( $version) ](fg:teal)'

[rust]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[golang]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[php]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[java]
symbol = " "
format = '[$symbol( $version) ](fg:teal)'

[kotlin]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[haskell]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[python]
symbol = ""
format = '[$symbol( $version) ](fg:teal)'

[docker_context]
symbol = ""
format = '[$symbol( $context) ](fg:blue)'
only_with_files = true

[time]
disabled = false
time_format = "%I:%M %p"
format = '[ $time](fg:maroon)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[vi ](bold fg:green)'
vimcmd_replace_one_symbol = '[vi ](bold fg:purple)'
vimcmd_replace_symbol = '[vi ](bold fg:purple)'
vimcmd_visual_symbol = '[vi ](bold fg:lavender)'
