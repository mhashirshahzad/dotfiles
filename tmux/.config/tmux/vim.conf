# VIM BINDINGS LETS GO
bind -n C-S-h  select-pane -m \; \
                select-pane -L \; \
                swap-pane -d \; \
                select-pane -M
bind -n C-S-j  select-pane -m \; \
                select-pane -D \; \
                swap-pane -d \; \
                select-pane -M
bind -n C-S-k    select-pane -m \; \
                select-pane -U \; \
                swap-pane -d \; \
                select-pane -M
bind -n C-S-l select-pane -m \; \
                select-pane -R \; \
                swap-pane -d \; \
                select-pane -M
bind -n C-M-h resize-pane -L
bind -n C-M-l resize-pane -R
bind -n C-M-k resize-pane -U
bind -n C-M-j resize-pane -D
bind -n C-h  select-pane -L
bind -n C-l select-pane -R
bind -n C-k    select-pane -U
bind -n C-j  select-pane -D

